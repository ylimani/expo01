<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      text-align: center;
      background-color: #bcbcbc;
      height: 50vh; /* Limit height to 50% of the viewport */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      height: 10vh; /* Ensures image is also limited to 50% height */
      object-fit: contain; /* Keeps the image proportions */
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/ylimani/expo01/main/harta_expo.jpg" alt="Map">
</body>
</html>
